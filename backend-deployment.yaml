apiVersion: apps/v1
kind: Deployment
metadata:
  name: guestbook-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: guestbook-backend
  template:
    metadata:
      labels:
        app: guestbook-backend
    spec:
      containers:
        - name: backend-api
          image: hashicorp/http-echo:latest
          ports:
            - containerPort: 8080 # Adjust if your backend uses a different port
          envFrom:
            - configMapRef:
                name: guestbook-backend-config
            - secretRef:
                name: guestbook-db-credentials
